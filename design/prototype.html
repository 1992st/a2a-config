<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A2A Config 工作目录原型</title>
  <link rel="stylesheet" href="../web/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">A2A</span><strong>A2A Config</strong></div>
    <div class="header-actions"><span>端口状态 10:30:00</span><button class="button">刷新</button><button class="button primary">添加工作目录</button></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">工作目录</div>
      <button class="workspace-item active"><span class="dot running"></span><span><span class="workspace-name">win-stock</span><span class="workspace-path">/work/win-stock</span></span></button>
      <button class="workspace-item"><span class="dot"></span><span><span class="workspace-name">research-agent</span><span class="workspace-path">/work/research-agent</span></span><span class="warning-icon" title="配置端口 9910 与 win-stock 重复">!</span></button>
    </aside>
    <main>
      <header class="page-header"><div><h1>win-stock</h1><p class="path">/work/win-stock</p></div><button class="button">复制启动命令</button></header>
      <section class="status-panel running"><div><strong class="status-title">已配置连接</strong><p class="status-detail">已配置其他 Pi 1 个 · Server 运行于端口 9910</p></div><button class="button">关闭 Server</button></section>
      <nav class="tabs"><button class="tab active">Server</button><button class="tab">连接其他 Pi</button><button class="tab">允许其他 Pi 连接</button></nav>
      <section class="section">
        <div class="section-header"><div><h2>Server 配置</h2><p class="section-description">状态和端口冲突优先显示；其余参数按需调整。</p></div></div>
        <div class="form-grid">
          <div class="field"><label>instanceId</label><input class="control mono" value="win-stock"></div>
          <div class="field"><label>Agent 名称</label><input class="control" value="win-stock"></div>
          <div class="field"><label>监听地址</label><select class="control mono"><option>0.0.0.0</option></select></div>
          <div class="field"><label>端口</label><input class="control mono" value="9910"><p class="field-help">未发现其他受管 Pi 使用该端口</p></div>
          <div class="field"><label>备用端口数量</label><input class="control mono" value="10"></div>
          <div class="field"><label>对外地址</label><input class="control mono" placeholder="自动"></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
