<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A2A Config</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#172126;background:#f5f7f8;--line:#d7dee1;--muted:#5e6a70;--green:#176b5b;--soft:#e8f3f0;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.top{height:56px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:600}.top-actions{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - 56px)}aside{border-right:1px solid var(--line);padding:18px 12px;background:#f5f7f8}main{background:#fff;padding:28px 32px 100px;min-width:0}.side-title{padding:0 8px 10px;color:var(--muted);font-size:12px;font-weight:600}.dir{margin-bottom:14px}.dir-head{padding:8px;border-radius:6px;display:flex;align-items:center;gap:7px}.dir-head strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dir-head small{display:block;color:var(--muted);font:11px/16px monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dir-items{margin-left:22px;border-left:1px solid var(--line);padding-left:8px}.tree-item{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:6px;color:#172126}.tree-item:hover,.tree-item.active{background:var(--soft);color:#0e5145;font-weight:600}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aeb8bc;margin-right:7px}.dot.on{background:#067647;box-shadow:0 0 0 3px #d8f3e6}.side-add{margin-top:auto;padding:12px 4px 0;border-top:1px solid var(--line)}.button{min-height:36px;padding:7px 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#172126;font-weight:500}.button.primary{background:var(--green);border-color:var(--green);color:#fff}.button.danger{color:var(--danger);border-color:#e2aaa4}.button:disabled{color:#929ca1;background:#eef1f2}.button.full{width:100%}.header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.header h1{font-size:20px;line-height:28px;margin:0}.path{margin:4px 0 0;color:var(--muted);font:12px/18px monospace;overflow-wrap:anywhere}.tabs{display:flex;gap:24px;margin-top:18px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:11px 0;white-space:nowrap}.tab.active{color:var(--green);border-color:var(--green);font-weight:600}.section{padding:25px 0;border-bottom:1px solid #e7ebed}.section h2{font-size:16px;margin:0 0 4px}.help{font-size:12px;color:var(--muted);margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}.field label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}.control{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;color:#172126}.mono{font-family:monospace;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #e7ebed}.row:first-child{border-top:0}.row-main{min-width:0}.row-main strong{display:block}.row-main small{display:block;color:var(--muted);font:12px/18px monospace;overflow-wrap:anywhere}.row-actions{display:flex;gap:6px;flex:0 0 auto}.status{font-size:12px;color:#067647}.status.warn{color:#b54708}.save{position:fixed;bottom:0;left:288px;right:0;display:none;justify-content:flex-end;gap:8px;padding:12px 32px;background:rgba(255,255,255,.96);border-top:1px solid var(--line)}.save.show{display:flex}.empty{padding:30px 0;color:var(--muted);font-size:14px}.notice{padding:10px 12px;border-left:3px solid #b54708;background:#fff8ed;color:#7a3500;font-size:12px;line-height:18px;margin-bottom:18px}.notice.ok{border-color:#067647;background:#ecfdf3;color:#05603a}.toast{position:fixed;top:72px;right:20px;background:#ecfdf3;border:1px solid #acd8c6;color:#05603a;padding:10px 13px;border-radius:6px;opacity:0;transform:translateY(-6px);transition:.15s;pointer-events:none}.toast.show{opacity:1;transform:none}dialog{width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 36px rgba(23,33,38,.14)}dialog::backdrop{background:rgba(23,33,38,.42)}.dialog-head,.dialog-foot{padding:16px 20px;border-bottom:1px solid #e7ebed;display:flex;justify-content:space-between;gap:12px;align-items:center}.dialog-foot{border-top:1px solid #e7ebed;border-bottom:0;justify-content:flex-end}.dialog-body{padding:20px;overflow:auto}dialog h2{margin:0;font-size:16px}pre{margin:0;padding:14px;background:#f1f4f5;border:1px solid var(--line);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/19px monospace}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.hidden{display:none!important}
    .field.full{grid-column:1 / -1}
    @media(max-width:899px){.layout{display:block}aside{position:fixed;z-index:5;top:56px;bottom:0;left:0;width:304px;transform:translateX(-100%);transition:.18s;box-shadow:0 12px 36px rgba(23,33,38,.14)}aside.open{transform:none}main{padding:24px}.menu{display:inline-block!important}.save{left:0}.scrim{display:none;position:fixed;inset:56px 0 0;z-index:4;background:rgba(23,33,38,.42);border:0}.scrim.open{display:block}}
    @media(max-width:639px){.top{padding:0 12px}.menu{display:inline-grid!important}.refresh-time{display:none}main{padding:18px 16px 84px}.header{display:block}.grid{grid-template-columns:1fr}.tabs{gap:20px}.save{padding:10px 12px}.save .button{flex:1}.save{justify-content:stretch}.row{align-items:flex-start}.row-actions{flex-direction:column}.dialog-head,.dialog-foot,.dialog-body{padding-left:16px;padding-right:16px}}
    .menu{display:none;border:1px solid var(--line);background:#fff;border-radius:6px;height:32px;width:32px}
  </style>
</head>
<body>
  <div class="shell" id="app">
    <header class="top"><div class="brand"><button class="menu" id="menu" aria-label="打开配置目录">☰</button> A2A Config</div><div class="top-actions"><span class="refresh-time" id="refresh-time"></span><button class="button" id="refresh">刷新</button></div></header>
    <button class="scrim" id="scrim" aria-label="关闭配置目录"></button>
    <div class="layout"><aside id="sidebar"><div class="side-title">Pi 配置目录</div><div id="tree"></div><div class="side-add"><button class="button full" id="add-dir">添加配置目录</button><button class="button full" id="add-profile" style="margin-top:8px">添加工作目录实例</button></div></aside><main><div class="header"><div><h1 id="title">正在读取…</h1><p class="path" id="path"></p></div><div id="runtime"></div></div><nav class="tabs" role="tablist"><button class="tab active" data-tab="server" role="tab">Server</button><button class="tab" data-tab="outgoing" role="tab">连接其他 Pi</button><button class="tab" data-tab="incoming" role="tab">允许其他 Pi 连接</button></nav><div id="content"></div></main></div>
    <div class="save" id="save"><button class="button" id="discard">放弃更改</button><button class="button primary" id="save-preview">保存更改</button></div><div class="toast" id="toast" role="status"></div>
  </div>
  <dialog id="directory-dialog"><div class="dialog-head"><div><h2>添加 Pi 配置目录</h2><small class="help">必须包含 settings.json</small></div><button class="close" data-close>×</button></div><div class="dialog-body"><div class="field"><label for="directory-input">配置目录</label><input class="control mono" id="directory-input" placeholder="/Users/name/.pi/agent"></div><p id="directory-error" class="notice hidden"></p></div><div class="dialog-foot"><button class="button" data-close>取消</button><button class="button primary" id="directory-submit">验证并添加</button></div></dialog>
  <dialog id="action-dialog"><div class="dialog-head"><div><h2 id="action-title"></h2><small class="help" id="action-help"></small></div><button class="close" data-close>×</button></div><div class="dialog-body" id="action-body"></div><div class="dialog-foot"><button class="button" data-close>取消</button><button class="button primary" id="action-submit">确认</button></div></dialog>
  <dialog id="preview-dialog"><div class="dialog-head"><div><h2>保存配置</h2><small class="help">只展示本次实际修改</small></div><button class="close" data-close>×</button></div><div class="dialog-body"><h3>settings.json</h3><pre id="settings-diff"></pre><h3>.env.local</h3><pre id="env-diff"></pre></div><div class="dialog-foot"><button class="button" data-close>返回修改</button><button class="button primary" id="apply">确认保存</button></div></dialog>
    <dialog id="prompt-dialog"><div class="dialog-head"><div><h2>连接 Prompt</h2><small class="help">复制到另一台 Pi</small></div><button class="close" data-close>×</button></div><div class="dialog-body"><pre id="prompt"></pre></div><div class="dialog-foot"><button class="button" data-close>关闭</button><button class="button primary" id="copy">复制 Prompt</button></div></dialog>
  </dialog>
  <script>
    const state={directories:[],selected:null,tab:"server",draft:null,previewId:null};
    const $=(s)=>document.querySelector(s); const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2400)}
    function selectedInstance(){for(const dir of state.directories)for(const instance of dir.instances||[])if(instance.key===state.selected)return {...instance,dir};return null}
    async function api(path,options){const response=await fetch(path,{headers:{"content-type":"application/json",...(options?.headers||{})},...options});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||"请求失败");return data}
    function renderTree(){const tree=$("#tree");tree.innerHTML=state.directories.map((dir)=>`<section class="dir"><div class="dir-head"><span>›</span><span style="min-width:0"><strong>${esc(dir.realPath||dir.path)}</strong><small>${dir.valid?`${dir.instances.length} 个工作目录实例`:(dir.error||"目录无效")}</small></span></div><div class="dir-items">${(dir.instances||[]).map((i)=>`<button class="tree-item ${i.key===state.selected?"active":""}" data-instance="${esc(i.key)}"><span class="dot ${i.registry?.length?"on":""}"></span>${esc(i.globalOnly?"创建第一个工作目录实例":(i.instanceId||i.cwd))}</button>`).join("")||`<div class="empty">还没有工作目录实例</div>`}</div></section>`).join("")||`<div class="empty">没有检测到 Pi 配置目录</div>`;tree.querySelectorAll("[data-instance]").forEach((el)=>el.onclick=()=>{state.selected=el.dataset.instance;state.draft=null;state.tab="server";render()})}
    function render(){const i=selectedInstance();if(!i){$("#title").textContent="没有可配置的 Pi";$("#path").textContent="请添加包含 settings.json 的 Pi 配置目录";$("#runtime").textContent="";$("#content").innerHTML=`<div class="empty">点击左侧“添加配置目录”开始。</div>`;return}$("#title").textContent=i.instanceId||i.cwd;$("#path").textContent=i.cwd;$("#runtime").innerHTML=i.registry?.length?`<span class="status"><span class="dot on"></span>运行中</span>`:`<span class="status" style="color:#5e6a70"><span class="dot"></span>未运行</span>`;document.querySelectorAll(".tab").forEach((t)=>t.classList.toggle("active",t.dataset.tab===state.tab));const d=state.draft||{server:i.server,instanceId:i.instanceId,workspace:i.workspace,outgoing:[],incoming:[]};if(state.tab==="server")$("#content").innerHTML=serverView(i,d);else if(state.tab==="outgoing")$("#content").innerHTML=outgoingView(i);else $("#content").innerHTML=incomingView(i);bindContent(i,d);$("#save").classList.toggle("show",Boolean(state.draft))}
    function serverView(i,d){return `<form id="server-form"><section class="section"><h2>Server</h2><p class="help">只配置当前工作目录实例的 A2A 服务。</p>${!i.plugin.installed?`<div class="notice">未检测到 zhangst_a2a-pi。请先安装插件后再保存 A2A 配置。</div>`:""}<div class="grid"><div class="field"><label for="instance-id">instanceId</label><input class="control mono" id="instance-id" value="${esc(d.instanceId||"")}"></div><div class="field"><label for="agent-name">Agent 名称</label><input class="control" id="agent-name" value="${esc(d.server?.agentName||d.instanceId||"")}"></div><div class="field"><label for="host">监听地址</label><select class="control mono" id="host"><option ${d.server?.host==="127.0.0.1"?"selected":""}>127.0.0.1</option><option ${d.server?.host==="0.0.0.0"?"selected":""}>0.0.0.0</option></select></div><div class="field"><label for="port">端口</label><input class="control mono" id="port" type="number" min="1" max="65535" value="${Number(d.server?.port||9910)}"></div><div class="field"><label for="fallback">备用端口数量</label><input class="control mono" id="fallback" type="number" min="0" max="100" value="${Number(d.server?.portFallback??10)}"></div><div class="field"><label for="public-url">对外地址（可选）</label><input class="control mono" id="public-url" value="${esc(d.server?.publicUrl||"")}" placeholder="自动"></div><div class="field full"><label for="workspace-id">Workspace ID</label><input class="control mono" id="workspace-id" value="${esc(d.workspace?.id||"")}"><p class="help">目录：${esc(d.workspace?.root||i.cwd)}</p></div></div></section><section class="section"><div class="row"><div class="row-main"><strong>Server 状态</strong><small>${i.server.enabled?"开启后需在 Pi 执行 /reload":"当前关闭"}</small></div><button class="button ${i.server.enabled?"primary":""}" type="button" id="toggle-server">${i.server.enabled?"已开启":"开启 Server"}</button></div></section></form>`}
    function outgoingView(i){const rows=[...(i.peers||[]),...((state.draft?.outgoing||[]).map((p)=>({name:p.name,value:{url:p.url},token:p.token,draft:true})))];return `<section class="section"><div class="header"><div><h2>连接其他 Pi</h2><p class="help">只保存名称、URL 和 token；远端能力每次验证时读取。</p></div><button class="button primary" id="add-outgoing">添加连接</button></div>${rows.length?rows.map((p)=>`<div class="row"><div class="row-main"><strong>${esc(p.name)}${p.draft?" · 未保存":""}</strong><small>${esc(p.value.url)}</small><small>Token：${esc(p.token||"未配置")}</small></div><div class="row-actions"><button class="button" data-verify="${esc(p.name)}">验证</button><button class="button danger" data-remove-outgoing="${esc(p.name)}">删除</button></div></div>`).join(""):`<div class="empty">还没有远程 Pi 连接。</div>`}</section>`}
    function incomingView(i){const rows=[...(i.inbound||[]),...((state.draft?.incoming||[]).map((p)=>({name:p.name,token:p.token,value:{},draft:true})))];return `<section class="section"><div class="header"><div><h2>允许其他 Pi 连接</h2><p class="help">添加后，该 Pi 可连接当前 workspace。</p></div><button class="button primary" id="add-incoming">添加连接方</button></div>${rows.length?rows.map((p)=>`<div class="row"><div class="row-main"><strong>${esc(p.name)}${p.draft?" · 未保存":""}</strong><small>Token：${esc(p.token||"未配置")}</small><small>Workspace：${esc(i.workspace.id)}</small></div><div class="row-actions"><button class="button" data-prompt="${esc(p.name)}">生成 Prompt</button><button class="button danger" data-remove="${esc(p.name)}">删除</button></div></div>`).join(""):`<div class="empty">还没有连接方。</div>`}</section>`}
    function bindContent(i,d){const form=$("#server-form");form?.addEventListener("input",()=>{state.draft=readDraft(i,d);renderSave()});$("#toggle-server")?.addEventListener("click",()=>{state.draft=readDraft(i,d);state.draft.server.enabled=!i.server.enabled;render()});$("#add-outgoing")?.addEventListener("click",()=>addOutgoing(i));$("#add-incoming")?.addEventListener("click",()=>addIncoming(i));document.querySelectorAll("[data-verify]").forEach((b)=>b.onclick=()=>toast(`已请求验证 ${b.dataset.verify}`));document.querySelectorAll("[data-prompt]").forEach((b)=>b.onclick=()=>showPrompt(i,b.dataset.prompt));document.querySelectorAll("[data-remove]").forEach((b)=>b.onclick=()=>{state.draft={...state.draft,removeIncoming:[b.dataset.remove]};renderSave();toast("已标记删除，点击保存确认")});document.querySelectorAll("[data-remove-outgoing]").forEach((b)=>b.onclick=()=>{state.draft={...state.draft,removeOutgoing:[b.dataset.removeOutgoing]};renderSave();toast("已标记删除，点击保存确认")})}
    function readDraft(i,d){const server=d.server||i.server||{};return {instanceId:$("#instance-id")?.value||d.instanceId||i.instanceId,server:{...server,enabled:server.enabled===true,agentName:$("#agent-name")?.value||server.agentName,host:$("#host")?.value||server.host,port:Number($("#port")?.value||server.port),portFallback:Number($("#fallback")?.value??server.portFallback),publicUrl:$("#public-url")?.value??server.publicUrl},workspace:{id:$("#workspace-id")?.value||d.workspace?.id||i.workspace.id,root:i.workspace.root}}}
    function renderSave(){$("#save").classList.add("show")}
    let actionMode=null;
    function openAction(mode){actionMode=mode;const title={profile:"添加工作目录实例",outgoing:"添加远程 Pi",incoming:"添加连接方"}[mode];const help={profile:"创建一个按工作目录绑定的 A2A 实例",outgoing:"保存 URL 和 token，不发送任务",incoming:"登记名称和 token，生成可复制的连接 Prompt"}[mode];$("#action-title").textContent=title;$("#action-help").textContent=help;$("#action-body").innerHTML=mode==="profile"?`<div class="field"><label for="action-cwd">工作目录</label><input class="control mono" id="action-cwd" placeholder="/Volumes/Workspaces/project"></div><div class="field" style="margin-top:16px"><label for="action-instance">instanceId</label><input class="control mono" id="action-instance" placeholder="project"></div><div class="field" style="margin-top:16px"><label for="action-workspace">Workspace ID</label><input class="control mono" id="action-workspace" placeholder="project"></div>`:mode==="outgoing"?`<div class="field"><label for="action-name">远程 Pi 名称</label><input class="control mono" id="action-name" placeholder="research-pi"></div><div class="field" style="margin-top:16px"><label for="action-url">A2A URL</label><input class="control mono" id="action-url" placeholder="http://host:9910/a2a/v1"></div><div class="field" style="margin-top:16px"><label for="action-token">Token</label><input class="control mono" id="action-token"></div><div class="field" style="margin-top:16px"><label for="action-scope">保存范围</label><select class="control" id="action-scope"><option value="profile">仅当前实例</option><option value="global">配置目录内共享</option></select></div>`:`<div class="field"><label for="action-name">连接方名称</label><input class="control mono" id="action-name" placeholder="research-pi"></div><div class="field" style="margin-top:16px"><label for="action-token">Token</label><input class="control mono" id="action-token"></div>`;$("#action-dialog").showModal()}
    async function addOutgoing(i){openAction("outgoing")}
    async function addIncoming(i){openAction("incoming")}
    function showPrompt(i,name){const p=[...(i.inbound||[]),...((state.draft?.incoming||[]).map((item)=>({name:item.name,token:item.token})))].find((x)=>x.name===name);if(!p)return;const publicBase=(i.server.publicUrl||`http://${i.server.host}:${i.server.port}`).replace(/\/+$/,"");const a2aUrl=publicBase.endsWith("/a2a/v1")?publicBase:`${publicBase}/a2a/v1`;$("#prompt").textContent=`请为当前 Pi 配置 A2A client 连接。\n\n远程 Pi 名称：${i.agentName}\nA2A URL：${a2aUrl}\n当前 Pi 在远程 server 上的身份：${name}\n连接 token：${p.token}\n插件路径：/Volumes/zhangstExtern/code/pi/pi_extensions/zhangst_a2a-pi\n\n请将名称和 URL 写入 settings.json 的 a2a.peers，将 token 写入 .env.local 当前 PI_A2A_<INSTANCE_ID>.outbound.peers，然后提示用户执行 /reload。`;$("#prompt-dialog").showModal()}
    $("#copy").onclick=async()=>{await navigator.clipboard?.writeText($("#prompt").textContent||"");toast("Prompt 已复制")};$("#refresh").onclick=load;$("#menu").onclick=()=>{$("#sidebar").classList.add("open");$("#scrim").classList.add("open")};$("#scrim").onclick=()=>{$("#sidebar").classList.remove("open");$("#scrim").classList.remove("open")};$("#add-dir").onclick=()=>$("#directory-dialog").showModal();$("#directory-submit").onclick=async()=>{try{const r=await api("/api/agent-dirs/validate",{method:"POST",body:JSON.stringify({path:$("#directory-input").value})});await api("/api/agent-dirs",{method:"POST",body:JSON.stringify({path:r.realPath})});$("#directory-dialog").close();toast("已添加配置目录");load()}catch(e){$("#directory-error").textContent=e.message;$("#directory-error").classList.remove("hidden")}};$("#discard").onclick=()=>{state.draft=null;render()};$("#save-preview").onclick=async()=>{const i=selectedInstance();try{const r=await api("/api/config/preview",{method:"POST",body:JSON.stringify({agentDir:i.dir.realPath,cwd:i.cwd,draft:state.draft})});state.previewId=r.previewId;$("#settings-diff").textContent=r.settingsDiff;$("#env-diff").textContent=r.envDiff;$("#preview-dialog").showModal()}catch(e){toast(e.message)}};$("#apply").onclick=async()=>{try{await api("/api/config/apply",{method:"POST",body:JSON.stringify({previewId:state.previewId})});$("#preview-dialog").close();state.draft=null;toast("配置已保存，请在 Pi 执行 /reload");await load()}catch(e){toast(e.message)}};document.querySelectorAll("[data-close]").forEach((b)=>b.onclick=()=>b.closest("dialog").close());document.querySelectorAll(".tab").forEach((b)=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
    $("#add-profile").onclick=async()=>{const dir=state.directories.find((item)=>item.valid);if(!dir)return toast("请先添加有效的 Pi 配置目录");openAction("profile")};
    $("#action-submit").onclick=async()=>{try{const i=selectedInstance();const dir=i?.dir||state.directories.find((item)=>item.valid);if(!dir)return toast("请先添加有效的 Pi 配置目录");if(actionMode==="profile"){const cwd=$("#action-cwd").value.trim();const raw=cwd.split(/[\\/]/).filter(Boolean).pop()||"pi-agent";const id=$("#action-instance").value.trim()||raw.toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/^-+/,"a-");const workspaceId=$("#action-workspace").value.trim()||id;await api("/api/instances",{method:"POST",body:JSON.stringify({agentDir:dir.realPath,cwd,instanceId:id,workspaceId})})}else{const draft=actionMode==="outgoing"?{outgoing:[{name:$("#action-name").value.trim(),url:$("#action-url").value.trim(),token:$("#action-token").value}],outgoingScope:$("#action-scope").value}:{incoming:[{name:$("#action-name").value.trim(),token:$("#action-token").value}]};state.draft={...(state.draft||{}),...draft}}$("#action-dialog").close();toast(actionMode==="profile"?"工作目录实例已创建":"已添加到草稿");render()}catch(e){toast(e.message)}};
    async function load(){try{const data=await api("/api/state");state.directories=data.directories;const first=state.directories.flatMap((d)=>d.instances||[])[0];if(!state.selected||!selectedInstance())state.selected=first?.key||null;$("#refresh-time").textContent=`刷新于 ${new Date().toLocaleTimeString()}`;renderTree();render()}catch(e){toast(e.message)}}load();
  </script>
</body>
</html>
