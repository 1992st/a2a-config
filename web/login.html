<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A2A Config 登录</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/file-transfer.css">
</head>
<body class="login-page">
  <main class="login-main">
    <form class="login-form" id="login-form">
      <h1>A2A Config</h1>
      <p class="section-description">输入启动服务时配置的管理 Token。</p>
      <label for="admin-token">管理 Token</label>
      <input class="control mono" id="admin-token" type="password" required autofocus>
      <output class="field-help login-error" id="login-error"></output>
      <button class="button primary" type="submit">登录</button>
    </form>
  </main>
  <script>
    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: document.querySelector("#admin-token").value }) });
      if (response.ok) location.href = "/";
      else document.querySelector("#login-error").textContent = "管理 Token 不正确";
    });
  </script>
</body>
</html>
